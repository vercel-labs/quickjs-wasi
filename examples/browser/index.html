<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>quickjs-wasi Browser Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #0a0a0a;
      color: #e0e0e0;
    }
    h1 { margin-bottom: 0.25rem; font-size: 1.5rem; }
    p.subtitle { color: #888; margin-bottom: 1.5rem; font-size: 0.9rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    textarea {
      width: 100%;
      height: 200px;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: 'Geist Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 14px;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #555; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.75rem;
    }
    button {
      padding: 0.5rem 1.25rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .ext-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: #999;
      cursor: pointer;
      user-select: none;
    }
    .ext-toggle:hover { color: #ccc; }
    .ext-toggle input[type="checkbox"] {
      accent-color: #2563eb;
      cursor: pointer;
    }
    #output {
      margin-top: 1.5rem;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: 'Geist Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      min-height: 80px;
      max-height: 400px;
      overflow-y: auto;
    }
    .output-entry { padding: 2px 0; }
    .output-entry.log { color: #a0a0a0; }
    .output-entry.log span { vertical-align: top; }
    .output-entry.result { color: #4ade80; }
    .output-entry.error { color: #f87171; white-space: pre-wrap; }
    .info { color: #60a5fa; }
    #status { margin-top: 1rem; font-size: 0.85rem; color: #666; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="./main.tsx"></script>
</body>
</html>
